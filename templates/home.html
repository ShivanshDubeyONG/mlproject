<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Predict Math Score</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    display:flex; align-items:center; justify-content:center;
    padding:30px 15px;
  }
  .container {
    background:#fff;
    border-radius:16px;
    padding:40px;
    max-width:520px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  h2 { color:#1e1b4b; margin-bottom:6px; }
  p.sub { color:#666; margin-bottom:24px; font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; color:#333; margin:14px 0 5px; }
  select, input[type=number] {
    width:100%;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  select:focus, input:focus { border-color:#4f46e5; }
  button {
    width:100%;
    margin-top:24px;
    padding:13px;
    background:#4f46e5;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .2s;
  }
  button:hover { background:#4338ca; }
  .result {
    margin-top:22px;
    padding:16px;
    background:#ecfdf5;
    border:1px solid #10b981;
    border-radius:8px;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#065f46;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Predict Math Score</h2>
    <p class="sub">Fill in the details below to get a predicted math score.</p>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

      <label>Gender</label>
      <select name="gender" required>
        <option value="" disabled selected>Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label>Race / Ethnicity</label>
      <select name="ethnicity" required>
        <option value="" disabled selected>Select group</option>
        <option value="group A">Group A</option>
        <option value="group B">Group B</option>
        <option value="group C">Group C</option>
        <option value="group D">Group D</option>
        <option value="group E">Group E</option>
      </select>

      <label>Parental Level of Education</label>
      <select name="parental_level_of_education" required>
        <option value="" disabled selected>Select education</option>
        <option value="some high school">Some High School</option>
        <option value="high school">High School</option>
        <option value="some college">Some College</option>
        <option value="associate's degree">Associate's Degree</option>
        <option value="bachelor's degree">Bachelor's Degree</option>
        <option value="master's degree">Master's Degree</option>
      </select>

      <label>Lunch Type</label>
      <select name="lunch" required>
        <option value="" disabled selected>Select lunch type</option>
        <option value="standard">Standard</option>
        <option value="free/reduced">Free/Reduced</option>
      </select>

      <label>Test Preparation Course</label>
      <select name="test_preparation_course" required>
        <option value="" disabled selected>Select status</option>
        <option value="none">None</option>
        <option value="completed">Completed</option>
      </select>

      <label>Reading Score (0-100)</label>
      <input type="number" name="reading_score" min="0" max="100" required>

      <label>Writing Score (0-100)</label>
      <input type="number" name="writing_score" min="0" max="100" required>

      <button type="submit">Predict Math Score</button>
    </form>

    {% if results is defined %}
    <div class="result">Predicted Math Score: {{ results }}</div>
    {% endif %}
  </div>
</body>
</html>
